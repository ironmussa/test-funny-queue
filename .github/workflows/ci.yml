name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The merge queue runs the required checks on its own merge group commit.
  merge_group:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
